name: bale-platform
label: Bale
kind: platform
description: >
  Bale (Iranian messenger) gateway adapter for Hermes Agent.
  Reuses the Telegram adapter engine against tapi.bale.ai.
version: 1.0.0
author: hermes
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token from @BotFather in Bale"
    prompt: "Bale bot token"
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to chat"
  - name: BALE_ALLOW_ALL_USERS
    description: "If set, all users are allowed"
  - name: BALE_HOME_CHANNEL
    description: "Default Bale chat id for cron/notification delivery"
